const lines=raw.split('\n'), phases=[];for(let i=0;i<lines.length;i+=2)phases.push([...lines[i].split('|'),lines[i+1].split('|')]);const $=id=>document.getElementById(id),keys=phases.flatMap((p,i)=>p[2].map((t,j)=>i+'-'+j));let done=new Set(['0-0']);try{const s=localStorage.getItem('japan-check-v1');if(s)done=new Set(JSON.parse(s).filter(k=>keys.includes(k)))}catch(e){}let opened=new Set([0]);function save(){try{localStorage.setItem('japan-check-v1',JSON.stringify([...done]));$('status').textContent='Sauvegarde locale automatique active'}catch(e){$('status').textContent='Stockage indisponible : exporte ta sauvegarde.'}}function render(){const n=done.size;$('pct').textContent=(100*n/keys.length).toLocaleString('fr-FR',{maximumFractionDigits:2})+' %';$('global').max=keys.length;$('global').value=n;$('completed').textContent=n;$('remaining').textContent=keys.length-n;$('stages').textContent=phases.filter((p,i)=>p[2].every((t,j)=>done.has(i+'-'+j))).length+'/13';$('list').replaceChildren();const q=$('search').value.toLowerCase();phases.forEach((p,i)=>{const d=document.createElement('details');d.open=opened.has(i)||!!q;const s=document.createElement('summary');const count=p[2].filter((t,j)=>done.has(i+'-'+j)).length;s.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>${p[0]}<br><small>${p[1]} · ${count}/${p[2].length}</small><progress max="${p[2].length}" value="${count}"></progress>`;d.append(s);let visible=0;p[2].forEach((t,j)=>{const k=i+'-'+j;if(($('hide').checked&&done.has(k))||!(t+' '+p[0]).toLowerCase().includes(q))return;visible++;const l=document.createElement('label');l.className='task'+(done.has(k)?' done':'');const c=document.createElement('input');c.type='checkbox';c.checked=done.has(k);const span=document.createElement('span');span.textContent=t;c.onchange=()=>{c.checked?done.add(k):done.delete(k);save();render()};l.append(c,span);d.append(l)});d.ontoggle=()=>{if(!d.isConnected)return;d.open?opened.add(i):opened.delete(i)};if(visible||!q)$('
